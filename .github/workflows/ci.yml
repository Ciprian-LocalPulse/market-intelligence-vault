name: Repository verification
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Public documentation and secret checks
        run: python tools/check_public_repository.py
      - name: Canonical schema and score validation
        run: python tools/validate_repository.py --as-of 2026-10-06 --audit-scores
      - name: Repository regressions
        run: python -m unittest discover -s tests -v
      - name: Dashboard export regressions
        run: python -m unittest discover -s dashboard/tests -v
      - name: UI logic regressions
        run: node --test dashboard/tests/test_ui.mjs
      - name: Validated dashboard export
        run: python tools/export_dashboard_data.py --as-of 2026-10-06 --refresh
